name: CI

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.test.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.test.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action Pinning & Update Policy
# ===============================
# GitHub Actions are pinned to commit SHAs (v6.0.2, v6.4.0, v7.0.0) verified for
# Node 24 compatibility as of c18d3bf. Maintenance cadence:
#   - Patch versions: update immediately when security fixes are released
#   - Minor versions: update quarterly (e.g., first Monday of each quarter)
#   - Major versions: only after downstream compatibility is verified
#
# To review upstream releases:
#   - Set a quarterly reminder to check GitHub Release notes for each action
#   - Test any minor/major bumps in a feature branch before merging to main
#   - Document the compatibility baseline date in this comment
#
# Last reviewed: 2026-08-31 (Node-24 baseline verified against c18d3bf)

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Critical-path coverage check
        if: matrix.node-version == 22 && github.event_name == 'pull_request'
        run: node scripts/check-critical-coverage.mjs origin/${{ github.base_ref }}
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
